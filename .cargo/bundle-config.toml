[env]
# Zed Vela: the -Z flags below are nightly-only, but the pinned toolchain is stable.
# RUSTC_BOOTSTRAP lets cargo's rustc (and its target probe) accept them while bundling.
RUSTC_BOOTSTRAP = "1"

[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib"]

[target.'cfg(all(target_os = "linux", target_env = "musl"))']
rustflags = ["-C", "target-feature=+crt-static"]

# Zed Vela: shave metadata from release binaries. These need the RUSTC_BOOTSTRAP
# environment variable set above, and must live in a target section because
# `[build] rustflags` is ignored on Windows whenever a matching target rustflags
# entry exists.
#
# Cargo replaces (does not merge) rustflags for a target when `--config` is used,
# so the base Windows flags from `.cargo/config.toml` are repeated here. Omitting
# them silently drops `crt-static` (livekit fails to link) and `target-cpu=native`.
# `target-cpu=native` assumes the build host is the machine that runs the binary.
[target.'cfg(target_os = "windows")']
rustflags = [
    "--cfg",
    "windows_slim_errors",
    "-C",
    "target-feature=+crt-static",
    "-C",
    "target-cpu=native",
    "-Z",
    "location-detail=none",
    "-Z",
    "fmt-debug=none",
]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
